name: Update Profile Art

on:
  workflow_dispatch:
  schedule:
    - cron: "17 18 * * *"

permissions:
  contents: write

jobs:
  update-profile-art:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Fetch contribution data
        run: |
          python scripts/fetch_contributions.py

      - name: Render contribution heatmap
        run: |
          python scripts/render_heatmap_svg.py

      - name: Commit generated profile assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/contributions.json assets/contrib-heatmap.svg

          if git diff --cached --quiet; then
            echo "No profile art changes detected."
            exit 0
          fi

          git commit -m "chore: update contribution profile art"
          git push
